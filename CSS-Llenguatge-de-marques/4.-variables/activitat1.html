<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color per titol</title>
</head>
<body>
    <style>
        :root{
            --color-titulo:#5f0d96;
            --color-retitulo: #8457e6;
            --color-links: #b0b0e9;
        }
        h1{
            color: var(--color-titulo);
        }
        h2{
            color: var(--color-retitulo);
        }
        a{
            color: var(--color-links);
        }
    </style>
    <h1>Mascotes ideals</h1>
    <h2>Gats: <a href="https://en.wikipedia.org/wiki/Cat">https://en.wikipedia.org/wiki/Cat</a></h2>
    <h2>Llops: <a href="https://es.wikipedia.org/wiki/Canis_lupus">https://es.wikipedia.org/wiki/Canis_lupus</a></h2>
</body>
</html>
