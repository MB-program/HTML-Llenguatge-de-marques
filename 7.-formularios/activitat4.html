<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Càmares de Fotos</title>
</head>
<body>
    <fieldset>
        <legend>Càmares</legend>
            <label>
            Tipus:
            <select name="tipus">
                <option value="0">Compacta</option>
                <option value="1">Bridge</option>
                <option value="2">Réflex</option>
                <option value="3">CSC</option>
                <option value="4">360º</option>
            </select>
            </label>
            <br>
            <label>
            MP:
            <select name="mp">
                <option value="0">12MP</option>
                <option value="1">50MP</option>
            </select>
            </label>
            <br>
            <label>
            Preu (0-x):
            <input type="text" name="preu">
            </label>
            <br>
    <button type="submit">Buscar</button>
    </fieldset>
</body>
</html>
